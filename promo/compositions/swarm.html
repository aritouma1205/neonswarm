<template>
  <style>
    #root {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #05070f;
    }
    #swarm-canvas {
      position: absolute;
      inset: 0;
      width: 1920px;
      height: 1080px;
      z-index: 1;
    }
    .line {
      position: absolute;
      left: 0;
      right: 0;
      top: 240px;
      text-align: center;
      font-family: var(--display);
      font-size: 110px;
      font-weight: 400;
      letter-spacing: 0.18em;
      z-index: 3;
    }
    .line .w {
      display: inline-block;
      margin: 0 0.09em;
    }
    #line-1 .w:last-child {
      color: var(--cyan);
      text-shadow: 0 0 34px rgba(77, 232, 255, 0.8);
    }
    #line-2 .w:last-child {
      color: var(--magenta);
      text-shadow: 0 0 34px rgba(255, 77, 157, 0.8);
    }
    #flash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, #eafcff 0%, rgba(77, 232, 255, 0.9) 38%, rgba(5, 7, 15, 0) 72%);
      opacity: 0;
      z-index: 8;
    }
  </style>

  <div id="root" data-composition-id="swarm" data-width="1920" data-height="1080">
    <canvas id="swarm-canvas" class="clip" data-start="0" data-duration="4.6" width="1920" height="1080"></canvas>

    <div class="clip" id="line-1" data-start="0.55" data-duration="4.05">
      <h2 class="line"><span class="w">ONE</span><span class="w">SHIP.</span></h2>
    </div>
    <div class="clip" id="line-2" data-start="1.9" data-duration="2.7">
      <h2 class="line" style="top: 660px"><span class="w">AN</span><span class="w">ENDLESS</span><span class="w">SWARM.</span></h2>
    </div>

    <div class="clip" id="flash" data-start="0" data-duration="4.6" data-layout-allow-occlusion></div>
    <div class="clip scan" id="swarm-scan" data-start="0" data-duration="4.6" style="z-index: 6" data-layout-allow-occlusion></div>
    <div class="clip vig" id="swarm-vig" data-start="0" data-duration="4.6" style="z-index: 2"></div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const cvs = document.getElementById('swarm-canvas');
    const ctx = cvs.getContext('2d');

    // deterministic motes — seeded rng, positions are pure functions of progress p
    function rng(seed) {
      let a = seed >>> 0;
      return () => {
        a |= 0; a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }
    const R = rng(0x5eed);
    const COLORS = ['#ff4d9d', '#ff7a45', '#ffe14d', '#b45dff', '#ff3b3b'];
    const CX = 960, CY = 540;

    // pre-rendered glow sprites (+ a dedicated cyan for the ship)
    const spriteFor = c => {
      const s = document.createElement('canvas');
      s.width = s.height = 64;
      const g = s.getContext('2d');
      const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.2, c);
      grad.addColorStop(1, c + '00');
      g.fillStyle = grad;
      g.fillRect(0, 0, 64, 64);
      return s;
    };
    const shipSprite = spriteFor('#4de8ff');
    const sprites = COLORS.map(spriteFor);

    const N = 340;
    const motes = [];
    for (let i = 0; i < N; i++) {
      motes.push({
        a: R() * Math.PI * 2,
        r0: 620 + R() * 620,
        r1: 24 + R() * 90,
        size: 6 + R() * 15,
        c: i % COLORS.length,
        wob: R() * Math.PI * 2,
        wspd: 3 + R() * 4,
        delay: R() * 0.35,
      });
    }

    function draw(p) {
      ctx.fillStyle = '#05070f';
      ctx.fillRect(0, 0, 1920, 1080);

      // faint grid
      ctx.strokeStyle = 'rgba(77,232,255,0.05)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      for (let x = 0; x <= 1920; x += 120) { ctx.moveTo(x, 0); ctx.lineTo(x, 1080); }
      for (let y = 0; y <= 1080; y += 120) { ctx.moveTo(0, y); ctx.lineTo(1920, y); }
      ctx.stroke();

      // the ship at center (same triangle as the game)
      const flick = 0.85 + 0.15 * Math.sin(p * 80);
      ctx.drawImage(shipSprite, CX - 70 * flick, CY - 70 * flick, 140 * flick, 140 * flick);
      ctx.save();
      ctx.translate(CX, CY);
      ctx.beginPath();
      for (let i = 0; i < 3; i++) {
        const a = (i * Math.PI * 2) / 3;
        const x = Math.cos(a) * 22, y = Math.sin(a) * 22;
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = '#0a1526';
      ctx.fill();
      ctx.strokeStyle = '#4de8ff';
      ctx.lineWidth = 4;
      ctx.stroke();

      // converging motes — visible faintly at the rim from frame 0
      for (const m of motes) {
        const lp = Math.min(1, Math.max(0, (p * 1.12 - m.delay) / 0.62));
        const ease = lp * lp;
        const r = m.r0 + (m.r1 - m.r0) * ease;
        const wob = Math.sin(p * m.wspd * 6 + m.wob) * 26 * (1 - lp);
        const x = CX + Math.cos(m.a) * r - Math.sin(m.a) * wob;
        const y = CY + Math.sin(m.a) * r + Math.cos(m.a) * wob;
        const s = m.size * (0.8 + lp * 1.1) * 2.2;
        ctx.globalAlpha = 0.22 + lp * 0.78;
        ctx.drawImage(sprites[m.c], x - s / 2, y - s / 2, s, s);
      }
      ctx.globalAlpha = 1;
    }

    draw(0);

    const tl = gsap.timeline({ paused: true });
    const prog = { p: 0 };
    tl.to(prog, { p: 1, duration: 4.45, ease: 'power1.in', onUpdate: () => draw(prog.p) }, 0);

    // per-word blur-in entrances (0.13s, staggered)
    tl.fromTo('#line-1 .w', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.16, ease: 'power4.out', stagger: 0.09 }, 0.55);
    tl.fromTo('#line-2 .w', { opacity: 0, filter: 'blur(8px)' }, { opacity: 1, filter: 'blur(0px)', duration: 0.16, ease: 'power4.out', stagger: 0.09 }, 1.9);
    // exits: blur-out word by word, faster
    tl.to('#line-1 .w', { opacity: 0, filter: 'blur(10px)', duration: 0.2, ease: 'power2.in', stagger: 0.05 }, 3.55);
    tl.to('#line-2 .w', { opacity: 0, filter: 'blur(10px)', duration: 0.2, ease: 'power2.in', stagger: 0.05 }, 3.62);
    // convergence flash into the cut
    tl.fromTo('#flash', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power3.in' }, 4.15);

    window.__timelines['swarm'] = tl;
  </script>
</template>
